<html>
  <head>
    <title>Register a course</title>
    <style>
      body {
        background-color: rgb(153, 198, 200);
        text-align: center;
      }

      form {
        margin: auto;
        padding: 20px;
        width: 400px;
        background-color: #fff;
      }

      input,
      select,
      button {
        width: 90%;
        padding: 10px;
        margin: 10px;
      }

      button {
        background-color: #4caf50;
        color: white;
        font-weight: bold;
        font-size: medium;
        cursor: pointer;
      }

      button:hover {
        background-color: #104212;
      }
    </style>
  </head>
  <body>
    <h1 style="color: yellow">Welcome to Registration</h1>

    <form action="http://localhost:8080/courses/register" method="post">
      <label for="name">Enter your name:</label><br />
      <input type="text" name="name" /><br /><br />

      <label for="email">Enter your emailId:</label><br />
      <input type="email" name="emailId" /><br /><br />

      <label for="course">Choose a Course</label><br />
      <select id="course" name="courseName">
            <option value="Java">Java</option>
            <option value="Python">Python</option>
            <option value="Spring Boot">Spring Boot</option>
            <option value="Flutter Development">Flutter Development</option>
            <option value="React JS">React JS</option>
            <option value="Node.js">Node.js</option>
            <option value="Machine Learning">Machine Learning</option>
            <option value="Data Structures">Data Structures</option>
      </select>

      <br /><br />

      <button type="submit">Submit</button>

<button type="button" onclick="window.location.href='index.html'">
    Go Home
</button>
      <script>
        function goHome() {
          window.location.href = "index.html"; // Change to your home page
        }
      </script>
    </form>
  </body>
</html>
